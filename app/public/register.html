<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamForge | Crear cuenta</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/auth.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="logo auth-logo" href="/">STREAM<span>FORGE</span></a>
        <p class="eyebrow">ÚNETE A STREAMFORGE</p>
        <h1>Crear cuenta</h1>
        <p class="auth-subtitle">Regístrate para acceder a tus vídeos favoritos.</p>

        <form id="registerForm">
            <label for="username">Nombre de usuario</label>
            <input id="username" name="username" type="text"
                   autocomplete="username" minlength="2" maxlength="40"
                   placeholder="Tu nombre" required>

            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" placeholder="tu@email.com" required>

            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password"
                   autocomplete="new-password" minlength="8"
                   placeholder="Mínimo 8 caracteres" required>

            <p id="formMessage" class="form-message" role="alert"></p>
            <button class="primary-button auth-submit" type="submit">Crear cuenta</button>
        </form>

        <p class="auth-switch">¿Ya tienes cuenta?
            <a href="/login.html">Inicia sesión</a>
        </p>
        <a class="back-link" href="/">← Volver al catálogo</a>
    </main>
</body>
</html>
